[project]
name = "data-cleaner"
version = "0.1.0"
description = "Upload a messy CSV/Excel file, get a clean file, a cleaning report and a reusable recipe."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "clevercsv>=0.8",
    "ftfy>=6.2",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    # Backend runtime: Vercel installs only this list, never the extras below.
    "fastapi>=0.111",
    "sqlmodel>=0.0.19",
    "python-multipart>=0.0.9",
    "vercel==0.13.0",
    "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
backend = ["uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running test (about 1-2 minutes); still part of the default run"]

[tool.setuptools.packages.find]
include = ["engine*", "backend*"]

# Vercel reads the FastAPI app from here (https://vercel.com/docs/functions/runtimes/python).
[tool.vercel]
entrypoint = "backend.main:app"

# Vercel Queues push consumer for the job runner (DC_JOB_RUNNER=queue); see docs/CONTRACT.md 8.9.
[[tool.vercel.subscribers]]
entrypoint = "backend.worker"
