[project]
name = "data-cleaner-spike"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.163.1",
    "vercel==0.13.0",
    "psycopg[binary]==3.3.9",
    # slim engine (no pandas/numpy, duckdb, pyarrow); pins from the slim venv where 326 engine tests pass
    "polars==2.1.0",
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "RapidFuzz==3.14.6",
    "ftfy==6.3.1",
    "charset-normalizer==3.5.2",
    "clevercsv==0.8.5",
    "openpyxl==3.1.5",
]

[[tool.vercel.subscribers]]
entrypoint = "worker"
